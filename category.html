<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Categories | Wildwood & Willow Botanicals</title>
<style>
:root{--olive:#3e4f32;--terra:#c17a4a;--cream:#f5f0e8}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--cream);color:#333;font-family:Georgia,serif}
body{max-width:420px;margin:0 auto}
.header{position:relative;padding:18px 16px 10px;text-align:center;border-bottom:1px solid #e3dcd2}
.brand{color:var(--olive);font-size:1.13rem;font-weight:bold;letter-spacing:1px}
.subtitle{font-size:.67rem;letter-spacing:3px;color:var(--olive);margin-top:3px}
.back{display:inline-block;padding:12px 16px;color:var(--olive);text-decoration:none;font-size:.9rem}
main{padding:0 13px 26px}
h1{text-align:center;color:var(--olive);font-size:1.45rem;letter-spacing:1px;margin:10px 0 5px}
.intro{text-align:center;color:#665f57;font-size:.83rem;margin:0 0 16px}
nav.categories{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;margin:7px 0 12px}
.categories a{display:flex;flex-direction:column;align-items:center;padding:6px 1px;text-align:center;text-decoration:none;color:var(--olive);font-size:.6rem;border-radius:8px;min-width:0}
.categories a span{font-size:1.3rem;margin-bottom:3px}
.categories a[aria-current="page"]{background:#e4e5d9;font-weight:bold}
#items{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.item{display:flex;flex-direction:column;background:white;border:1px solid #e3d8ce;border-radius:12px;overflow:hidden;text-decoration:none;color:inherit;text-align:left;min-width:0;box-shadow:0 2px 4px #3e4f3210}
button.item{width:100%;font:inherit;cursor:pointer}
.photo{height:125px;display:flex;justify-content:center;align-items:center;background:#f0ebe4;margin:7px;border-radius:7px;overflow:hidden;color:#817b75;font-size:.8rem;text-align:center}
.photo img{width:100%;height:100%;object-fit:contain}
.photo img.product-thumbnail{object-fit:cover;object-position:center}
.item-info{padding:3px 10px 12px}
.item h2{font-size:1rem;line-height:1.14;color:var(--olive);margin:0 0 4px}
.item .price{font-size:.9rem;color:var(--terra);font-weight:bold;margin-bottom:5px}
.item p{font-size:.79rem;line-height:1.3;margin:3px 0}
.action{display:block;font-size:.72rem;color:#976540;margin-top:9px;font-weight:bold}
.message{grid-column:1/-1;padding:30px 15px;text-align:center;background:#fffcf8;border-radius:12px;color:var(--olive);line-height:1.5}
.overlay[hidden]{display:none}
.overlay{position:fixed;inset:0;z-index:1000;background:#283825;display:flex;justify-content:center;align-items:center;padding:18px}
.dialog{background:#fffdf8;border-radius:16px;border:2px solid #d9ccbb;position:relative;padding:30px 22px 22px;width:100%;max-width:370px;max-height:85dvh;overflow-y:auto}
.dialog h2{font-size:1.4rem;color:var(--olive);margin:0 34px 14px 0}
.dialog p{line-height:1.45;font-size:.95rem}
.dialog .close-x{position:absolute;right:8px;top:6px;background:none;border:0;font-size:2rem;color:var(--olive);padding:4px 10px}
.dialog .close-btn{background:var(--olive);border:0;color:white;border-radius:26px;padding:12px;width:100%;font:inherit;margin-top:8px}
.dialog a{display:block;color:var(--olive);white-space:nowrap;margin:8px 0 14px}
@media(max-width:330px){.brand{font-size:.96rem}.categories a{font-size:.52rem}.photo{height:100px}}
html,body{height:100%;overflow:hidden}
body{height:100dvh;display:flex;flex-direction:column;max-width:720px}
.header,.back{flex:none}
.header{padding:clamp(5px,1.5dvh,18px) 16px 6px}
.back{padding:clamp(5px,1dvh,12px) 16px}
main{flex:1;min-height:0;display:flex;flex-direction:column;padding:0 13px max(6px,env(safe-area-inset-bottom))}
#ww-order-notice{flex:none;margin:4px 0!important;padding:6px!important;font-size:.72rem!important;line-height:1.2!important}
h1{flex:none;margin:5px 0 3px}.intro{flex:none;margin:0 0 5px}
nav.categories{flex:none;margin:3px 0 7px}
#items{flex:1;min-height:0;grid-template-rows:minmax(0,1fr);gap:10px;overflow:hidden}
.item{min-height:0;max-height:100%;padding:0;justify-content:flex-start}
.photo{height:auto;aspect-ratio:2/1;flex:0 1 auto;min-height:0;max-height:48%;margin:7px}
.photo img{object-fit:contain}
.item-info{min-height:0;overflow:hidden;padding:3px 8px 8px;display:flex;flex-direction:column;flex:1}
.item h2,.item .price,.action{flex:none;overflow-wrap:anywhere}
.item p{min-height:0;overflow:hidden;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:5}
.action{margin-top:auto;padding-top:4px}
.pager{flex:none;display:flex;align-items:center;justify-content:center;gap:12px;padding:6px 0 0;color:var(--olive);font-size:.82rem}
.pager button{min-width:48px;min-height:36px;background:#fffdf8;border:1px solid #d9ccbb;border-radius:10px;color:var(--olive);font:inherit;font-weight:bold;cursor:pointer}
.pager button:disabled{opacity:.35;cursor:default}.pager[hidden]{display:none}
@media(max-height:500px){.header{padding:3px}.subtitle,.intro{display:none}.back{padding:3px 10px}h1{font-size:1rem;margin:2px} .categories a{padding:2px}.categories a span{font-size:.9rem;margin:0}nav.categories{margin:2px 0}#ww-order-notice{font-size:.65rem!important;padding:3px!important}.photo{max-height:40%;margin:4px}.item-info{padding:2px 5px}.item h2{font-size:.8rem}.item p{font-size:.68rem;-webkit-line-clamp:2}.action{font-size:.65rem}.pager{padding:2px}.pager button{min-height:28px}}
/* Category browsing: full copy and uncropped photos, with compact two-row pages. */
body.compact-catalog{max-width:1100px}
.compact-catalog #items{grid-template-rows:repeat(2,minmax(0,1fr));gap:8px}
.compact-catalog .photo{aspect-ratio:auto;height:clamp(52px,12dvh,110px);max-height:none;flex:none;margin:5px 5px 2px}
.compact-catalog .photo img.product-thumbnail{object-fit:contain}
.compact-catalog .item-info{flex:0 0 auto;overflow:visible;padding:3px 7px 6px}
.compact-catalog .item h2{font-size:.94rem;line-height:1.12;margin-bottom:3px}
.compact-catalog .item .price{margin-bottom:2px}
.compact-catalog .item p{display:block;overflow:visible;-webkit-line-clamp:unset;font-size:.875rem;line-height:1.18;flex:none}
.compact-catalog .action{font-size:.875rem;margin-top:3px;padding-top:2px}
@media(min-width:760px){.compact-catalog #items{grid-template-columns:repeat(3,minmax(0,1fr))}.compact-catalog .photo{height:clamp(70px,17dvh,170px)}.compact-catalog .item h2{font-size:1.1rem}.compact-catalog .item p{font-size:1rem}}
/* If full copy cannot fit, let the page grow rather than hide information. */
body.compact-catalog.catalog-overflow{height:auto;min-height:100dvh;overflow:visible}
html:has(body.catalog-overflow){height:auto;overflow:auto}
.catalog-overflow main{flex:none}.catalog-overflow #items{flex:none;grid-template-rows:auto auto;overflow:visible}.catalog-overflow .item{max-height:none}
/* Reserve pager space first; all thumbnails share one measured height. */
.compact-catalog .photo{height:var(--catalog-photo-height,clamp(28px,8dvh,85px))}
.compact-catalog .pager{padding:4px 0 max(4px,env(safe-area-inset-bottom));background:var(--cream)}
.catalog-overflow .pager{position:sticky;bottom:0;z-index:5}
</style>
  <script src="/js/store-status.js?v=7" defer></script>
  <script src="/js/catalog.js?v=3"></script>
</head>
<body>
<header class="header">
 <div class="brand">WILDWOOD &amp; WILLOW</div>
 <div class="subtitle">BOTANICALS</div>
</header>
<a class="back" href="index.html">← Back to Home</a>
<main>
 <nav class="categories" aria-label="Browse categories">
  <a href="category.html?category=Capsules" data-category="Capsules"><span>💊</span>CAPSULES</a>
  <a href="category.html?category=Tinctures" data-category="Tinctures"><span>💧</span>TINCTURES</a>
  <a href="category.html?category=Teas" data-category="Teas"><span>🍵</span>TEAS</a>
  <a href="category.html?category=Topicals" data-category="Topicals"><span>🌿</span>TOPICALS</a>
  <a href="category.html?category=Services" data-category="Services"><span>🌱</span>SERVICES</a>
 </nav>
 <div id="items" aria-live="polite"><div class="message">Loading…</div></div>
 <nav class="pager" id="catalog-pager" aria-label="Catalog pages" hidden><button type="button" id="prev-page" aria-label="Previous page">←</button><span id="page-count" aria-live="polite"></span><button type="button" id="next-page" aria-label="Next page">→</button></nav>
</main>
<div class="overlay" id="overlay" hidden>
 <section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialog-title" tabindex="-1">
  <button type="button" class="close-x" aria-label="Close">×</button>
  <h2 id="dialog-title"></h2>
  <p id="dialog-summary"></p>
  <p id="dialog-details"></p>
  <p>For questions or availability, call:</p>
  <a id="dialog-phone" href="tel:5074301250">507-430-1250</a>
  <button type="button" class="close-btn">Close</button>
 </section>
</div>
<script>
(function(){
 const categories=['Capsules','Tinctures','Teas','Topicals','Services'];
 const chosen=new URLSearchParams(location.search).get('category') || 'Capsules';
 const category=categories.find(x=>x.toLowerCase()===chosen.toLowerCase()) || 'Capsules';
 const services=category==='Services';
 document.title=category+' | Wildwood & Willow Botanicals';
 document.querySelectorAll('[data-category]').forEach(a=>{if(a.dataset.category===category)a.setAttribute('aria-current','page')});
 const list=document.getElementById('items');
 const pager=document.getElementById('catalog-pager'),prev=document.getElementById('prev-page'),next=document.getElementById('next-page');
 let allItems=[],page=0;
 let perPage=matchMedia('(min-width:760px)').matches?6:4;
 document.body.classList.add('compact-catalog');
 function resizeCatalog(){const first=page*perPage;perPage=matchMedia('(min-width:760px)').matches?6:4;page=Math.floor(first/perPage);render(allItems)}
 window.addEventListener('resize',resizeCatalog);
 window.visualViewport?.addEventListener('resize',resizeCatalog);
 const layoutObserver=new ResizeObserver(()=>fitCatalog());
 layoutObserver.observe(list);
 function changePage(delta){page=Math.max(0,Math.min(Math.ceil(allItems.length/perPage)-1,page+delta));render(allItems)}
 prev.addEventListener('click',()=>changePage(-1));next.addEventListener('click',()=>changePage(1));
  // Horizontal swipes change pages; ordinary taps still open the selected item.
  function bindCatalogSwipe(surface, change) {
    let start = null, suppressUntil = 0;
    surface.style.touchAction = 'pan-y pinch-zoom';
    surface.addEventListener('touchstart', e => {
      start = e.touches.length === 1 ? {x:e.touches[0].clientX,y:e.touches[0].clientY} : null;
    }, {passive:true});
    surface.addEventListener('touchcancel', () => {start=null}, {passive:true});
    surface.addEventListener('touchend', e => {
      if (!start || e.changedTouches.length !== 1 || e.touches.length) {start=null;return}
      const dx=e.changedTouches[0].clientX-start.x, dy=e.changedTouches[0].clientY-start.y;
      start=null;
      if (Math.abs(dx)<45 || Math.abs(dx)<Math.abs(dy)*1.4) return;
      suppressUntil=Date.now()+450;
      if(e.cancelable)e.preventDefault();
      change(dx<0?1:-1);
    }, {passive:false});
    surface.addEventListener('click', e => {
      if(Date.now()<suppressUntil){e.preventDefault();e.stopImmediatePropagation()}
    }, true);
  }
  bindCatalogSwipe(list, changePage);

 const overlay=document.getElementById('overlay');
 let lastFocus;
 const knownProducts=['arnica-aloe-cream','mental-reset','nerve-pain-relaxant','appetite-suppressant'];
 const knownServices=['reflexology','vibration-therapy','foot-detox','massage-chair'];
 function openService(item){
   lastFocus=document.activeElement;
   document.getElementById('dialog-title').textContent=item.title||'Service';
   document.getElementById('dialog-summary').textContent=item.description||'';
   document.getElementById('dialog-details').textContent=item.details||'Contact the store to learn more about this service.';
   overlay.hidden=false;
   overlay.querySelector('.close-x').focus();
 }
 function closeService(){overlay.hidden=true;if(lastFocus&&lastFocus.isConnected)lastFocus.focus()}
 overlay.querySelectorAll('button').forEach(b=>b.addEventListener('click',closeService));
 overlay.addEventListener('click',e=>{if(e.target===overlay)closeService()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!overlay.hidden)closeService()});
 function render(items){
   document.body.classList.remove('catalog-overflow');
   allItems=items;
   const pages=Math.max(1,Math.ceil(items.length/perPage));page=Math.max(0,Math.min(page,pages-1));
   pager.hidden=pages<=1;prev.disabled=page===0;next.disabled=page===pages-1;
   document.getElementById('page-count').textContent=(page+1)+' of '+pages;
   list.replaceChildren();
   if(!items.length){
     const message=document.createElement('div');
     message.className='message';
     message.textContent=services?'No services are listed yet. Please check back soon.':'No '+category.toLowerCase()+' products are listed yet. Please check back soon.';
     list.append(message);
     return;
   }
   items.slice(page*perPage,(page+1)*perPage).forEach(item=>{
     const card=document.createElement(services?'button':'a');
     card.className='item';
     if(services){card.type='button';card.addEventListener('click',()=>openService(item))}
     else card.href='product.html?p='+encodeURIComponent(item.slug)+'&type=products';
     const photo=document.createElement('div');photo.className='photo';
     const cardPhoto=services ? item.image : (item.image_thumb || item.image_full || item.image);
     if(cardPhoto){
       const img=document.createElement('img');img.src=window.WWCatalog.image(cardPhoto);img.alt='';if(!services)img.className='product-thumbnail';
       img.onerror=()=>{img.remove();photo.textContent='Photo coming soon'};
       photo.append(img);
     }else photo.textContent='Photo coming soon';
     const info=document.createElement('div');info.className='item-info';
     const name=document.createElement('h2');name.textContent=item.title||'Item';
     info.append(name);
     if(!services&&(item.price||/^0+$/.test(item.quantity_available||''))){const price=document.createElement('div');price.className='price';price.textContent=/^0+$/.test(item.quantity_available||'')?'Temporarily Sold Out':item.price;info.append(price)}
     const description=document.createElement('p');description.textContent=item.description||'';info.append(description);
     const action=document.createElement('span');action.className='action';action.textContent=services?'More information':'View product';info.append(action);
     card.append(photo,info);list.append(card);
   })
   requestAnimationFrame(fitCatalog);
 }
 function fitCatalog(){
     if(document.body.classList.contains('catalog-overflow'))return;
     const cards=[...list.querySelectorAll('.item')];
     list.style.removeProperty('--catalog-photo-height');
     const photos=cards.map(card=>card.querySelector('.photo'));
     const preferred=Math.min(...photos.map(photo=>photo.getBoundingClientRect().height));
     if(photos.length){
       const excess=Math.max(0,...cards.map(card=>card.querySelector('.item-info').getBoundingClientRect().bottom-card.getBoundingClientRect().bottom+5));
       list.style.setProperty('--catalog-photo-height',Math.max(24,Math.floor(preferred-excess-2))+'px');
     }
     const clipped=cards.some(card=>card.querySelector('.action').getBoundingClientRect().bottom>card.getBoundingClientRect().bottom-2);
     document.body.classList.toggle('catalog-overflow',clipped);
 }
 async function init(){
   const folder=services?'services':'products';
   const found=await window.WWCatalog.list(folder);
   render(services?found:found.filter(x=>(x.category||'').toLowerCase()===category.toLowerCase()));
   if (services) {
     const requested = new URLSearchParams(location.search).get('service');
     const selected = found.find(item => item.slug === requested);
     if (selected) openService(selected);
   }
   if(services){
     try{
       const res=await fetch('/content/settings/contact.md?v=' + Date.now(),{cache:'no-store'});
       const contact=res.ok ? window.WWCatalog.parse(await res.text()) : null;
       if(contact&&contact.phone){
         const p=document.getElementById('dialog-phone');
         p.textContent=contact.phone;p.href='tel:'+contact.phone.replace(/[^\d+]/g,'');
       }
     }catch(e){}
   }
 }
 init();
})();
</script>
</body>
</html>
