backend:
  name: github
  repo: jeromeleegriffin/wildwood-willow
  branch: main
  base_url: https://dawn-recipe-9862wildwood-oauth.jeromeleegriffin.workers.dev
  auth_endpoint: auth

media_folder: images
public_folder: /images

collections:
  - name: products
    label: Products
    folder: content/products
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Price, name: price, widget: string }
      - { label: Quantity Available, name: quantity_available, widget: number, value_type: int, min: 0, max: 9999, step: 1, hint: "Legacy catalog count. Use the Inventory page for physical counts used by guest checkout and order reservations." }
      - { label: Description, name: description, widget: text }
      - { label: Featured, name: featured, widget: boolean, default: false }
      - { label: Category, name: category, widget: select, options: ["Capsules", "Tinctures", "Teas", "Topicals", "Home"] }
      - { label: Full Product Photo, name: image_full, widget: image, required: false, hint: "Original uncropped photo displayed on the product page and in the tap-to-enlarge viewer." }
      - { label: Card Thumbnail, name: image_thumb, widget: image, required: false, hint: "Tightly cropped landscape thumbnail for homepage, category, and shop cards. Recommended 800 x 400 (2:1)." }

  - name: services
    label: Services
    folder: content/services
    create: true
    slug: "{{slug}}"
    fields:
      - { label: Title, name: title, widget: string }
      - { label: Description, name: description, widget: text }
      - { label: More About This Service, name: details, widget: text, required: false, hint: "Shown in the service information popup" }
      - { label: Featured, name: featured, widget: boolean, default: true }
      - { label: Image, name: image, widget: image }

  - name: settings
    label: Site Settings
    files:
      - file: content/settings/store-status.json
        label: Website Availability
        name: store_status
        format: json
        fields:
          - label: Website Status
            name: mode
            widget: select
            default: open
            options:
              - { label: "Open Website (Accept Orders)", value: open }
              - { label: "Pause Orders Only", value: pause_orders }
              - { label: "Temporarily Close Website", value: temporarily_closed }
            hint: "All options are reversible. Temporarily Close Website only displays a temporary notice; it never deletes your site."
          - { label: Temporary Closure Heading, name: closed_title, widget: string, default: "We'll Be Back Soon" }
          - { label: Temporary Closure Message, name: closed_message, widget: text, default: "Wildwood & Willow Botanicals is temporarily unavailable. Please check back soon." }
          - { label: Orders Paused Message, name: orders_message, widget: text, default: "Online ordering is temporarily paused. You can still browse our products and services." }
      - file: content/settings/contact.md
        label: Contact & Hours
        name: contact
        fields:
          - { label: Phone Number, name: phone, widget: string, default: "507-430-1250" }
          - { label: Address Line 1, name: address1, widget: string, default: "21b SE 2nd St" }
          - { label: Address Line 2, name: address2, widget: string, default: "Ortonville MN" }
          - { label: Hours Line 1, name: hours1, widget: string, default: "Tue-Fri" }
          - { label: Hours Line 2, name: hours2, widget: string, default: "9am-5pm" }
      - file: content/settings/header.md
        label: Header Photo
        name: header
        fields:
          - { label: Header Photo, name: header_photo, widget: image }

  - name: coupons
    label: Coupon Codes
    files:
      - file: content/settings/coupons.json
        label: Manage Coupon Codes
        name: coupon_settings
        format: json
        fields:
          - label: Coupons
            name: coupons
            widget: list
            required: false
            fields:
              - {label: Code, name: code, widget: string, pattern: ['^[A-Za-z0-9_-]+$', 'Use letters, numbers, hyphens or underscores']}
              - {label: Enabled, name: enabled, widget: boolean, default: true}
              - {label: Discount Type, name: type, widget: select, options: [{label: Percentage, value: percent}, {label: Fixed Dollars, value: fixed}, {label: Free Shipping, value: shipping}]}
              - {label: Discount Amount, name: amount, widget: number, value_type: float, min: 0, default: 0, hint: 'For free shipping leave at zero. Enter 10 for 10% or $10, depending on type. Percentage cannot exceed 100.'}
              - {label: Minimum Merchandise Subtotal, name: minimum, widget: number, value_type: float, min: 0, default: 0}
              - {label: Expiration Date, name: expires, widget: datetime, date_format: YYYY-MM-DD, time_format: false, format: YYYY-MM-DD, required: false, hint: 'Valid through this date in Central Time.'}
