<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Content Manager</title>
</head>
<body>
  <button type="button" id="ww-preview-site" title="Preview the public site without reopening it to visitors">View Site (Admin Preview)</button>
  <style>
    #ww-preview-site {
      position: fixed; right: 12px; bottom: max(12px, env(safe-area-inset-bottom));
      z-index: 2147483640; border: 1px solid #c5d4bd; border-radius: 24px;
      background: #3e4f32; color: white; font: 600 13px system-ui, sans-serif;
      padding: 11px 14px; box-shadow: 0 4px 14px #0003; cursor: pointer;
    }
    #ww-preview-site:focus-visible { outline: 3px solid #c17a4a; outline-offset: 3px; }
  </style>
  <script>
    document.getElementById('ww-preview-site').addEventListener('click', () => {
      // Temporary, per-tab display preview. Admin editing still requires GitHub login.
      sessionStorage.setItem('ww-admin-preview-until', String(Date.now() + 30 * 60 * 1000));
      window.location.assign('../index.html');
    });
  </script>
  <script src="https://unpkg.com/@sveltia/cms/dist/sveltia-cms.js"></script>
</body>
</html>
