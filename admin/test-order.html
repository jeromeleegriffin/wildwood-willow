<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Test Checkout</title><style>body{font:16px Georgia;background:#f5f0e8;color:#3e4f32;max-width:640px;margin:20px auto;padding:16px}label{display:block;margin:10px 0}input,select,button{font:inherit;padding:9px;box-sizing:border-box;max-width:100%}input,select{width:100%}button{background:#3e4f32;color:white;border:0;border-radius:8px;cursor:pointer}section{background:white;padding:16px;border-radius:10px;margin:12px 0}pre{white-space:pre-wrap;font:inherit}</style><a href="./">Back to Admin</a><h1>Admin Test Checkout</h1><p>SIMULATION ONLY. No real payment, order, email or inventory change. Use fictional customer details.</p><section><h2>1. Test cart</h2><select id="product"></select><label>Quantity<input id="qty" type="number" min="1" max="99" value="1"></label><button id="add" disabled>Add product</button><div id="items"></div><label>Coupon<input id="coupon" placeholder="Optional coupon code"></label><button id="apply">Apply coupon</button><p id="notice" role="status"></p><pre id="total"></pre></section><section><h2>2. Contact and shipping</h2><form id="checkout"><label>Name<input required value="Test Customer"></label><label>Email<input required type="email" value="test@example.com"></label><label>Phone<input type="tel" value="555-0100"></label><label>Shipping address<input required value="123 Test Street"></label><label>City, state, ZIP<input required value="Test City, TN 00000"></label><h2>3. Payment</h2><label>Method<select id="method"><option>Cash App</option><option>Venmo</option></select></label><button id="submit" disabled>Simulate payment and place test order</button></form></section><section id="receipt" hidden><h2>Test order confirmation</h2><pre id="result"></pre><button onclick="window.print()">Print receipt</button> <button onclick="location.reload()">New test order</button></section><script src="/js/catalog.js?v=4"></script><script>
const $=id=>document.getElementById(id),money=n=>'$'+(n/100).toFixed(2);let products=[],cart=[],coupon=null,done=false;const base='https://raw.githubusercontent.com/jeromeleegriffin/wildwood-willow/main/content/settings/coupons.json';
function totals(){let subtotal=cart.reduce((s,p)=>s+p.price*p.qty,0),shipping=subtotal&&subtotal<=10000?800:0,discount=0;if(coupon&&subtotal>=Number(coupon.minimum||0)*100){if(coupon.type==='shipping')shipping=0;else if(coupon.type==='percent')discount=Math.min(subtotal,Math.round(subtotal*Number(coupon.amount)/100));else if(coupon.type==='fixed')discount=Math.min(subtotal,Math.round(Number(coupon.amount)*100));}return {subtotal,shipping,discount,total:subtotal+shipping-discount}}
function render(){ $('items').replaceChildren();cart.forEach((p,i)=>{const row=document.createElement('p'),b=document.createElement('button');row.textContent=p.qty+' × '+p.title+' '+money(p.qty*p.price)+' ';b.textContent='Remove';b.onclick=()=>{cart.splice(i,1);render()};row.append(b);$('items').append(row)});const t=totals();$('total').textContent='Subtotal: '+money(t.subtotal)+'\nDiscount: '+money(t.discount)+'\nShipping: '+money(t.shipping)+'\nSimulated total: '+money(t.total);$('submit').disabled=!cart.length||done}
(async()=>{try{products=(await WWCatalog.list('products')).map(p=>({...p,price:Math.round(Number(String(p.price).replace(/[$,]/g,''))*100)})).filter(p=>Number.isFinite(p.price)&&p.price>=0);products.forEach((p,i)=>$('product').add(new Option(p.title+' '+money(p.price),i)));$('add').disabled=!products.length}catch{$('notice').textContent='Unable to load catalog'}})();
$('add').onclick=()=>{const p=products[Number($('product').value)],q=Number($('qty').value);if(!p||!Number.isInteger(q)||q<1||q>99||done)return;const old=cart.find(x=>x.slug===p.slug);if(old)old.qty+=q;else cart.push({...p,qty:q});render()};
$('apply').onclick=async()=>{coupon=null;try{const code=$('coupon').value.trim().toUpperCase();if(!code){$('notice').textContent='Coupon removed';return}const r=await fetch(base+'?v='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error();const matches=(await r.json()).coupons.filter(c=>String(c.code).toUpperCase()===code&&c.enabled===true);const c=matches[0];if(matches.length!==1||!['shipping','percent','fixed'].includes(c.type)||c.expires||!Number.isFinite(Number(c.minimum||0))||Number(c.minimum||0)<0||(c.type!=='shipping'&&(!Number.isFinite(Number(c.amount))||Number(c.amount)<=0)))throw Error();coupon=c;$('notice').textContent='Test coupon applied if minimum is met.'}catch{$('notice').textContent='Coupon unavailable. Dated coupons are not supported in this test preview.'}finally{render()}};
$('checkout').onsubmit=e=>{e.preventDefault();if(done||!cart.length)return;done=true;const id='TEST-'+crypto.randomUUID().toUpperCase(),t=totals();$('result').textContent='Order '+id+'\n'+new Date().toLocaleString()+'\n'+cart.map(p=>p.qty+' × '+p.title).join('\n')+'\nSimulated total: '+money(t.total)+'\nPayment method: '+$('method').value+' (simulated)\nActual charge: $0.00\nStatus: TEST COMPLETE\nNo real order submitted.';$('receipt').hidden=false;document.querySelectorAll('form input,form select,#add,#apply').forEach(x=>x.disabled=true);render();$('receipt').scrollIntoView()};render();
</script></html>
