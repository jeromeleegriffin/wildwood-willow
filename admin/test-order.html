<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Test Order</title><style>body{font:16px Georgia;background:#f5f0e8;color:#3e4f32;max-width:600px;margin:24px auto;padding:16px}label{display:block;margin:12px 0}input,select,button{font:inherit;padding:8px;max-width:100%}button{background:#3e4f32;color:white;border:0;border-radius:8px}article{background:white;padding:16px;border-radius:10px;margin-top:16px}</style><a href="./">← Back to Admin</a><h1>Admin Test Order</h1><p>SIMULATION ONLY. No payment, real order, inventory change or customer notification.</p><form id="test"><label>Product <select id="product" required></select></label><label>Quantity <input id="qty" type="number" min="1" max="999" value="1" required></label><button>Simulate Order</button></form><article id="result" role="status" hidden></article><script src="/js/catalog.js?v=4"></script><script>
const product=document.getElementById('product'),result=document.getElementById('result');let items=[];
(async()=>{try{items=await WWCatalog.list('products');for(const [i,p] of items.entries()){const o=document.createElement('option');o.value=i;o.textContent=p.title+' — '+p.price;product.append(o)}}catch{result.hidden=false;result.textContent='Unable to load products.'}})();
document.getElementById('test').addEventListener('submit',e=>{e.preventDefault();const p=items[Number(product.value)];if(!p)return;const q=Number(document.getElementById('qty').value),price=Number(String(p.price).replace(/[$,]/g,''));if(!Number.isFinite(price)||price<0||!Number.isInteger(q)||q<1)return;const subtotal=Math.round(price*100)*q,shipping=subtotal<=10000?800:0;result.hidden=false;result.textContent='TEST COMPLETE — '+q+' × '+p.title+'. Simulated subtotal: $'+(subtotal/100).toFixed(2)+'. Simulated shipping: $'+(shipping/100).toFixed(2)+'. Simulated total: $'+((subtotal+shipping)/100).toFixed(2)+'. Actual charge: $0.00. No order submitted.'});
</script></html>
