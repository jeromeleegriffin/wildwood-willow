<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sales History · Wildwood &amp; Willow</title>
<style>
body{max-width:760px;margin:auto;padding:20px;background:#f5f0e8;color:#263420;font:16px/1.5 system-ui,sans-serif}
a{color:#314a2c} form,article{background:white;border-radius:10px;padding:16px;margin-block:14px}
form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,165px),1fr));gap:12px}
label{display:grid;gap:4px}input,select,button{font:inherit;padding:8px;min-width:0}
button{background:#3e4f32;color:white;border:0;border-radius:6px} article{overflow-wrap:anywhere}
h2{font-size:1.05rem;margin:0}article p{margin:.35em 0}
</style>
<nav><a href="./">Administrator panel</a> · <a href="orders.html?view=real">Real Orders</a></nav>
<h1>Sales History</h1><p>Online orders with confirmed payments. Dates are based on when the order was placed, in Central Time.</p>
<form id="filters">
<label>From date<input name="from" type="date"></label>
<label>Through date<input name="through" type="date"></label>
<label>Minimum total<input name="min" type="number" min="0" step="0.01"></label>
<label>Maximum total<input name="max" type="number" min="0" step="0.01"></label>
<label>Customer or order number<input name="query" type="search" maxlength="120"></label>
<label>Status<select name="status"><option value="">All confirmed sales</option><option value="payment_confirmed">Payment confirmed</option><option value="shipped">Shipped</option><option value="completed">Completed</option></select></label>
<button>Apply filters</button><button type="reset">Clear filters</button>
</form>
<button id="refresh" type="button">Refresh sales</button>
<p id="status" role="status"></p><p id="summary" aria-live="polite"></p>
<section id="sales" aria-label="Matching sales"></section>
<script>
const el=id=>document.getElementById(id);
const form=el('filters'), sales=el('sales'), statusLine=el('status'), summary=el('summary');
const labels={payment_confirmed:'Payment confirmed',shipped:'Shipped',completed:'Completed'};
const money=new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'});
const central=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Chicago',year:'numeric',month:'2-digit',day:'2-digit'});
const date=stamp=>central.format(new Date(stamp.includes('T')?stamp:stamp.replace(' ','T')+'Z'));
let orders=null;
function node(tag,text){const element=document.createElement(tag);element.textContent=text;return element;}
function render(){
  if (!orders) return;
  const f=Object.fromEntries(new FormData(form));
  const min=f.min==='' ? 0 : Math.round(Number(f.min)*100);
  const max=f.max==='' ? Infinity : Math.round(Number(f.max)*100);
  const query=f.query.trim().toLowerCase();
  sales.replaceChildren();
  summary.textContent='';
  if ((f.from&&f.through&&f.from>f.through)||min>max){
    statusLine.textContent='Check the date and total ranges.';
    return;
  }
  const matching=orders.filter(order=>
    (!f.from||date(order.created_at)>=f.from)&&(!f.through||date(order.created_at)<=f.through)&&
    order.total_cents>=min&&order.total_cents<=max&&(!f.status||order.status===f.status)&&
    (!query||[order.id,order.customer_name].some(value=>String(value||'').toLowerCase().includes(query))));
  statusLine.textContent=matching.length?'':'No confirmed sales match these filters.';
  const total=matching.reduce((sum,order)=>sum+order.total_cents,0);
  summary.textContent=matching.length+' '+(matching.length===1?'sale':'sales')+' · Total '+money.format(total/100);
  for (const order of matching){
    const card=node('article','');
    card.append(node('h2',money.format(order.total_cents/100)+' · '+date(order.created_at)),
      node('p',order.customer_name+' · '+labels[order.status]),node('p',order.id));
    sales.append(card);
  }
}
async function refresh(){
  el('refresh').disabled=true;
  statusLine.textContent='Loading sales…';
  try{
    const user=JSON.parse(localStorage.getItem('sveltia-cms.user')||'null');
    if(user?.backendName!=='github'||!user.token)throw Error('Sign in through the administrator panel, then return here.');
    const response=await fetch('https://wildwood-willow-orders.jeromeleegriffin.workers.dev/orders',
      {headers:{Authorization:'Bearer '+user.token},cache:'no-store'});
    if(response.status===401||response.status===403)throw Error('Sign in again with your administrator GitHub account.');
    if(!response.ok)throw Error('Sales could not be loaded. Try refreshing.');
    orders=(await response.json()).filter(order=>Object.hasOwn(labels,order.status))
      .sort((first,second)=>second.created_at.localeCompare(first.created_at));
    render();
  }catch(error){
    orders=null;sales.replaceChildren();summary.textContent='';statusLine.textContent=error.message;
  }finally{el('refresh').disabled=false;}
}
form.onsubmit=event=>{event.preventDefault();render();};
form.onreset=()=>setTimeout(render,0);
el('refresh').onclick=refresh;
refresh();
</script></html>
