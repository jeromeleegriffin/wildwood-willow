<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Product - Wildwood & Willow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Detail page fits the phone viewport; homepage styles are unchanged. */
    html, body { height: 100%; height: 100dvh; overflow: hidden; }
    body { display: block; height: 100dvh; min-height: 0; }
    .product-page {
      width: 100%; max-width: 420px; height: 100dvh;
      margin: 0 auto; padding: max(8px, env(safe-area-inset-top)) 12px max(10px, env(safe-area-inset-bottom));
      display: flex; flex-direction: column; align-items: stretch;
      gap: clamp(3px, 0.7dvh, 8px); overflow: hidden;
    }
    .product-photo {
      display: flex; justify-content: center; align-items: center;
      flex: 1 1 auto; min-height: 0; width: 100%;
      border-radius: 10px; background: #f5f0e8;
      overflow: hidden;
    }
    .product-photo[hidden] { display: none; }
    .product-photo img { display: block; width: 100%; height: 100%; object-fit: contain; object-position: center; }
    .product-no-photo { display: none; flex: 1 1 auto; min-height: 80px; background: #f0ebe4; color: #776f64; padding: 16px 12px; border-radius: 8px; text-align: center; align-content: center; }
    .product-no-photo.is-visible { display: block; }
    .product-page h1 { flex: 0 0 auto; font-size: clamp(1.05rem, 3dvh, 1.4rem); line-height: 1.13; color: #3e4f32; margin: 0; }
    .product-page .price { flex: 0 0 auto; font-size: 1.05rem; color: #c17a4a; font-weight: bold; margin: 0; }
    .product-page p { flex: 0 0 auto; font-size: clamp(.77rem, 1.9dvh, .9rem); line-height: 1.25; margin: 0; white-space: pre-line; overflow-wrap: anywhere; }
    .add-btn { flex: 0 0 auto; background: #c17a4a; color: white; border: none; padding: 10px 18px; border-radius: 20px; font-size: .95rem; width: 100%; cursor: pointer; }
    .add-btn:disabled { opacity: .55; cursor: not-allowed; }
    .price-help { font-size: .76rem !important; color: #665c51; line-height: 1.22 !important; margin: 0; }
    .price-help[hidden] { display: none; }
    .back { flex: 0 0 auto; align-self: start; display: inline-block; margin: 0; padding: 3px 0; color: #3e4f32; text-decoration: none; font-size: .85rem; }
    @media (max-height: 650px) {
      .product-page { gap: 3px; padding-top: 5px; padding-bottom: 6px; }
      .product-page h1 { font-size: 1.05rem; }
      .product-page .price { font-size: .95rem; }
      .product-page p { font-size: .77rem; line-height: 1.18; }
      .add-btn { padding: 7px 14px; font-size: .85rem; }
    }
    .popup {
      display: none;
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.4);
      align-items: center;
      justify-content: center;
      z-index: 100;
    }
    .popup.show { display: flex; }
    .popup-box {
      background: white;
      padding: 20px;
      border-radius: 12px;
      text-align: center;
      max-width: 280px;
      width: 90%;
    }
    .popup-box h3 { color: #3e4f32; margin-bottom: 8px; }
    .popup-box p { font-size: 0.85rem; color: #555; margin-bottom: 16px; }
    .popup-btns { display: flex; gap: 8px; }
    .popup-btns button, .popup-btns a {
      flex: 1;
      padding: 10px;
      border-radius: 16px;
      border: none;
      text-decoration: none;
      font-size: 0.85rem;
      text-align: center;
    }
    .popup-btns .cart-btn { background: #c17a4a; color: white; }
    .popup-btns .continue-btn { background: #f0ebe4; color: #3e4f32; }
  </style>
  <script src="/js/store-status.js?v=7" defer></script>
  <script src="/js/catalog.js?v=4"></script>
</head>
<body>
  <div class="product-page">
    <a href="index.html" class="back">← Back</a>
    <div id="product-photo" class="product-photo" hidden>
      <img id="product-img" alt="">
    </div>
    <div id="product-no-photo" class="product-no-photo">Product photo coming soon</div>
    <h1 id="product-title"></h1>
    <div class="price" id="product-price"></div>
    <p id="product-desc"></p>
    <p class="price-help" id="price-help" hidden>This product is not yet available to order online because its price hasn't been set. Please contact the store for details.</p>
    <label id="quantity-fields" hidden>Quantity <input id="product-quantity" type="number" inputmode="numeric" min="1" step="1" value="1" style="width:5em"></label>
    <button class="add-btn" id="add-to-cart-btn" disabled data-not-ready="true" onclick="addToCart()">Add to Cart</button>
  </div>

  <div class="popup" id="popup">
    <div class="popup-box">
      <h3>Added to Cart</h3>
      <p id="popup-item"></p>
      <div class="popup-btns">
        <a href="cart.html" class="cart-btn">Go to Cart</a>
        <button class="continue-btn" onclick="closePopup()">Continue Shopping</button>
      </div>
    </div>
  </div>

  <script>
    const params = new URLSearchParams(location.search);
    const slug = params.get('p');
    const folder = params.get('type') || 'products';

    async function loadProduct() {
      if (!slug || folder !== 'products') { showProductError(); return; }
      const data = await window.WWCatalog.document('products', slug);
      if (!data) {
        document.getElementById('product-title').textContent = 'Product unavailable';
        document.getElementById('add-to-cart-btn').disabled = true;
        return;
      }
      document.getElementById('product-title').textContent = data.title || '';
      const priceText = (data.price || '').trim();
      const priceIsValid = /^\$?\s*\d+(?:,\d{3})*(?:\.\d{1,2})?$/.test(priceText);
      window.productPriceReady = priceIsValid;
      document.getElementById('product-price').textContent = priceIsValid ? priceText : 'Price on request';
      document.getElementById('price-help').hidden = priceIsValid;
      const addButton = document.getElementById('add-to-cart-btn');
      const stock = window.WWCatalog.stock(data);
      if (stock === 0) {
        addButton.disabled = true;
        addButton.textContent = 'Temporarily Sold Out';
      } else if (!priceIsValid) {
        addButton.disabled = true;
        addButton.textContent = 'Contact Store for Price';
        addButton.title = 'Price must be set before online ordering';
        addButton.dataset.notReady = 'true';
      } else if (stock === null) {
        addButton.disabled = true;
        addButton.textContent = 'Contact Store for Availability';
      } else {
        delete addButton.dataset.notReady;
        addButton.textContent = 'Add to Cart';
        document.getElementById('product-quantity').max = stock;
        addButton.disabled = !window.WWStoreAvailability || !window.WWStoreAvailability.isOrderingAllowed();
      }
      document.getElementById('product-desc').textContent = data.description || '';
      const fullPhoto = data.image_full || data.image || data.image_thumb;
      const photoUrl = fullPhoto ? window.WWCatalog.image(fullPhoto) : '';
      const photoFrame = document.getElementById('product-photo');
      const noPhoto = document.getElementById('product-no-photo');
      if (photoUrl) {
        const photo = document.getElementById('product-img');
        photo.onerror = () => {
          photoFrame.hidden = true;
          noPhoto.classList.add('is-visible');
        };
        photo.src = photoUrl;
        photo.alt = (data.title || 'Product') + ' photograph';
        photoFrame.hidden = false;
        noPhoto.classList.remove('is-visible');
      } else {
        photoFrame.hidden = true;
        noPhoto.classList.add('is-visible');
      }
      document.title = (data.title || 'Product') + ' - Wildwood & Willow';
      window.currentProduct = data;
      window.currentSlug = slug;
      syncQuantityVisibility();
    }

    function syncQuantityVisibility() {
      document.getElementById('quantity-fields').hidden = !(window.WWStoreAvailability?.isOrderingAllowed() && window.productPriceReady && window.WWCatalog.stock(window.currentProduct) > 0);
    }
    document.addEventListener('ww:store-status', syncQuantityVisibility);
    let adding = false;
    async function addToCart() {
      if (!window.WWStoreAvailability || !window.WWStoreAvailability.isOrderingAllowed()) return;
      if (!window.currentProduct || !window.productPriceReady || adding) return;
      adding = true;
      try {
      const current = await window.WWCatalog.document('products', window.currentSlug, {freshOnly:true});
      if (!window.WWStoreAvailability.isOrderingAllowed()) return;
      const stock = window.WWCatalog.stock(current);
      const qtyInput = document.getElementById('product-quantity');
      const wanted = Number(qtyInput.value);
      let cart = [];
      try {
        const saved = JSON.parse(localStorage.getItem('ww-cart') || '[]');
        if (Array.isArray(saved)) cart = saved.filter(x => x && typeof x === 'object');
      } catch (error) {
        // Recover from damaged or outdated saved cart data.
      }
      const existing = cart.find(i => i.slug === window.currentSlug);
      const inCart = cart.filter(i => i.slug === window.currentSlug).reduce((sum,i) => sum + Math.max(1,Math.floor(Number(i.qty)||1)),0);
      if (stock === null || stock === 0 || !Number.isInteger(wanted) || wanted < 1 || wanted + inCart > stock) {
        document.querySelector('#popup h3').textContent = 'Quantity unavailable';
        document.getElementById('popup-item').textContent = stock === null ? 'We could not verify stock. Please try again.' : stock === 0 ? 'This product is temporarily sold out.' : 'You can add up to ' + Math.max(0,stock-inCart) + ' more. Check the quantity already in your cart.';
        document.getElementById('popup').classList.add('show');
        return;
      }
      if (existing) {
        const currentQty = Math.max(1, Math.floor(Number(existing.qty) || 1));
        existing.qty = currentQty + wanted;
        existing.title = window.currentProduct.title;
        existing.price = window.currentProduct.price;
        existing.image = window.currentProduct.image_thumb || window.currentProduct.image_full || window.currentProduct.image;
      } else {
        cart.push({
          slug: window.currentSlug,
          title: window.currentProduct.title,
          price: window.currentProduct.price,
          image: window.currentProduct.image_thumb || window.currentProduct.image_full || window.currentProduct.image,
          qty: wanted
        });
      }
      try {
        localStorage.setItem('ww-cart', JSON.stringify(cart));
      } catch (error) {
        document.getElementById('popup-item').textContent = 'Your browser could not save this item. Please check storage settings and try again.';
        document.getElementById('popup').classList.add('show');
        document.querySelector('#popup h3').textContent = 'Cart not saved';
        return;
      }
      document.querySelector('#popup h3').textContent = 'Added to Cart';
      document.getElementById('popup-item').textContent = window.currentProduct.title + ' was added to your cart.';
      document.getElementById('popup').classList.add('show');
      } finally { adding = false; }
    }

    function closePopup() {
      document.getElementById('popup').classList.remove('show');
    }

    function showProductError() {
      document.getElementById('product-title').textContent = 'Product unavailable';
      document.getElementById('product-desc').textContent = 'Please return to the catalog and try again.';
      document.getElementById('add-to-cart-btn').disabled = true;
    }
    loadProduct().catch(showProductError);
  </script>
</body>
</html>
