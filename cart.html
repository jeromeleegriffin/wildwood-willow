<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Wildwood & Willow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    .cart-page { padding: 12px; max-width: 420px; margin: 0 auto; background: #f5f0e8; min-height: 100vh; }
    .cart-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; align-items: center; }
    .cart-item img { width: 60px; height: 60px; object-fit: contain; background: #faf8f5; border-radius: 4px; }
    .cart-item .info { flex: 1; }
    .cart-item .title { font-weight: bold; font-size: 0.9rem; }
    .cart-item .price { color: #c17a4a; font-size: 0.85rem; }
    .remove-btn { background: none; border: none; color: #999; font-size: 0.8rem; cursor: pointer; padding: 4px 8px; }
    .checkout-btn { background: #c17a4a; color: white; border: none; padding: 12px; border-radius: 20px; width: 100%; margin-top: 16px; font-size: 1rem; }
    .empty { text-align: center; padding: 40px 0; color: #888; }
  </style>
  <script src="js/store-status.js?v=1" defer></script>
</head>
<body>
  <div class="cart-page">
    <a href="index.html" style="color:#3e4f32; text-decoration:none;">← Continue Shopping</a>
    <h2 style="color:#3e4f32; margin: 12px 0;">Your Cart</h2>
    <div id="cart-items"></div>
    <div id="total" style="text-align:right; margin-top:12px; font-weight:bold;"></div>
    <button class="checkout-btn" onclick="alert('Checkout will connect to a payment app later (Stripe, Square, etc.)')">Checkout</button>
  </div>

  <script>
    function loadCart() {
      const cart = JSON.parse(localStorage.getItem('ww-cart') || '[]');
      const container = document.getElementById('cart-items');
      if (!cart.length) {
        container.innerHTML = '<div class="empty">Your cart is empty</div>';
        document.getElementById('total').textContent = '';
        return;
      }
      let totalQty = 0;
      container.innerHTML = cart.map((item, index) => {
        const qty = item.qty || 1;
        totalQty += qty;
        return `
          <div class="cart-item">
            <img src="${(item.image || '').replace(/^\\/images\\//, 'images/')}" alt="">
            <div class="info">
              <div class="title">${item.title}</div>
              <div class="price">${item.price} × ${qty}</div>
            </div>
            <button class="remove-btn" onclick="removeItem(${index})">Remove</button>
          </div>
        `;
      }).join('');
      document.getElementById('total').textContent = totalQty + ' item' + (totalQty === 1 ? '' : 's');
    }

    function removeItem(index) {
      let cart = JSON.parse(localStorage.getItem('ww-cart') || '[]');
      cart.splice(index, 1);
      localStorage.setItem('ww-cart', JSON.stringify(cart));
      loadCart();
    }

    loadCart();
  </script>
</body>
</html>
