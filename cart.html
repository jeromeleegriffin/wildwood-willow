<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cart - Wildwood & Willow</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    /* Detail pages may be taller than one screen; keep homepage sizing untouched. */
    html, body { height: auto; min-height: 100%; overflow-x: hidden; overflow-y: auto; }
    body { display: block; min-height: 100dvh; }
    .cart-page { padding: 12px 12px 32px; max-width: 420px; margin: 0 auto; background: #f5f0e8; min-height: 100dvh; }
    .cart-item { display: flex; gap: 10px; padding: 8px 0; border-bottom: 1px solid #eee; align-items: center; }
    .cart-item img { width: 60px; height: 60px; object-fit: contain; background: #faf8f5; border-radius: 4px; }
    .cart-item .info { flex: 1; min-width: 0; overflow-wrap: anywhere; }
    .cart-item .title { font-weight: bold; font-size: 0.9rem; }
    .cart-item .price { color: #c17a4a; font-size: 0.85rem; }
    .remove-btn { background: none; border: none; color: #75665a; font-size: 0.78rem; cursor: pointer; padding: 6px; }
    .qty-controls { display: flex; align-items: center; gap: 8px; margin-top: 7px; }
    .qty-btn { width: 30px; height: 30px; border: 1px solid #c5b9ab; border-radius: 6px; background: white; color: #3e4f32; font-size: 1.05rem; cursor: pointer; }
    .qty-value { min-width: 14px; text-align: center; font-size: .9rem; }
    .cart-summary { text-align: right; margin: 12px 0 6px; font-weight: bold; color: #3e4f32; }
    .checkout-note { color: #665b50; text-align: center; font-size: .8rem; line-height: 1.35; margin-top: 8px; }
    .checkout-btn:disabled { opacity: .55; cursor: not-allowed; }
    .checkout-btn { background: #c17a4a; color: white; border: none; padding: 12px; border-radius: 20px; width: 100%; margin-top: 16px; font-size: 1rem; }
    .empty { text-align: center; padding: 40px 0; color: #888; }
  </style>
  <script src="/js/store-status.js?v=7" defer></script>
  <script src="/js/catalog.js?v=3"></script>
</head>
<body>
  <div class="cart-page">
    <a href="index.html" style="color:#3e4f32; text-decoration:none;">← Continue Shopping</a>
    <h2 style="color:#3e4f32; margin: 12px 0;">Your Cart</h2>
    <p id="cart-check-status" class="checkout-note" role="status">Checking current product details…</p>
    <div id="cart-items"></div>
    <div id="total" style="text-align:right; margin-top:12px; font-weight:bold;"></div>
    <p class="checkout-note">Online payment checkout is not connected yet. No orders or payments can be submitted.</p>
    <button class="checkout-btn" disabled title="Checkout is not yet connected">Checkout Coming Soon</button>
  </div>

  <script>
    let checkedItems = [];
    let checkedSource = '';
    let refreshSerial = 0;
    const currency = new Intl.NumberFormat('en-US', {style:'currency',currency:'USD'});

    function readCart() {
      try {
        const value = JSON.parse(localStorage.getItem('ww-cart') || '[]');
        return Array.isArray(value) ? value.filter(item => item && typeof item === 'object') : [];
      } catch { return []; }
    }
    function saveCart(cart) {
      localStorage.setItem('ww-cart', JSON.stringify(cart));
      refreshCart();
    }
    function parsePrice(price) {
      if (typeof price === 'number') return Number.isFinite(price) && price >= 0 ? price : null;
      const text = String(price == null ? '' : price).trim();
      if (!/^\$?\s*\d+(?:,\d{3})*(?:\.\d{1,2})?$/.test(text)) return null;
      const amount = Number(text.replace(/[$,\s]/g,''));
      return Number.isFinite(amount) && amount >= 0 ? amount : null;
    }
    function itemQty(item) {
      return Math.max(1, Math.min(99, Math.floor(Number(item.qty) || 1)));
    }
    async function refreshCart() {
      const request = ++refreshSerial;
      const cart = readCart();
      const source = JSON.stringify(cart);
      const status = document.getElementById('cart-check-status');
      status.textContent = cart.length ? 'Checking current prices and availability…' : '';
      checkedItems = [];
      checkedSource = '';
      renderCart(cart, true);
      if (!cart.length) { status.textContent = ''; return; }

      const checked = await Promise.all(cart.map(async (stored) => {
        const slug = String(stored.slug || '');
        if (!/^[a-z0-9_-]+$/i.test(slug)) return {stored, current:null};
        // Do not trust prices or titles saved in a visitor's browser.
        const current = await window.WWCatalog.document('products', slug, {freshOnly:true});
        return {stored, current};
      }));
      // Prevent a late response from undoing the visitor's quantity edits.
      if (request !== refreshSerial || JSON.stringify(readCart()) !== source) return;
      checkedItems = checked;
      checkedSource = source;
      const unavailable = checked.filter(({current}) => !current || parsePrice(current.price) === null).length;
      status.textContent = unavailable
        ? unavailable + ' item(s) need attention. Prices or availability could not be verified.'
        : 'Prices verified against the latest product listings.';
      renderCart(cart, false);
    }
    function renderCart(cart, checking) {
      const container = document.getElementById('cart-items');
      const summary = document.getElementById('total');
      container.replaceChildren();
      if (!cart.length) {
        const empty = document.createElement('div');
        empty.className = 'empty';
        empty.textContent = 'Your cart is empty';
        container.append(empty);
        summary.textContent = '';
        return;
      }
      let count = 0, total = 0, unavailable = false, changed = false;
      cart.forEach((stored, index) => {
        const qty = itemQty(stored);
        count += qty;
        const current = !checking && checkedSource === JSON.stringify(cart)
          ? checkedItems[index]?.current : null;
        const price = current ? parsePrice(current.price) : null;
        if (price === null) unavailable = true;
        else {
          total += price * qty;
          if (parsePrice(stored.price) !== price) changed = true;
        }
        const row = document.createElement('div');
        row.className = 'cart-item';
        if (current?.image || stored.image) {
          const img = document.createElement('img');
          const image = current?.image || stored.image;
          img.src = window.WWCatalog.image(image);
          img.alt = '';
          row.append(img);
        }
        const info = document.createElement('div');
        info.className = 'info';
        const title = document.createElement('div');
        title.className = 'title';
        title.textContent = current?.title || stored.title || 'Product';
        const amount = document.createElement('div');
        amount.className = 'price';
        amount.textContent = checking ? 'Checking current price…'
          : price === null ? 'Unavailable or price not confirmed'
          : currency.format(price) + ' each';
        info.append(title,amount);
        const controls = document.createElement('div');
        controls.className = 'qty-controls';
        const minus = document.createElement('button');
        minus.type = 'button'; minus.className = 'qty-btn'; minus.textContent = '−';
        minus.setAttribute('aria-label','Decrease quantity of '+title.textContent);
        minus.addEventListener('click', () => changeQty(index,-1));
        const number = document.createElement('span');
        number.className = 'qty-value'; number.textContent = String(qty);
        const plus = document.createElement('button');
        plus.type = 'button'; plus.className = 'qty-btn'; plus.textContent = '+';
        plus.disabled = qty >= 99;
        plus.setAttribute('aria-label','Increase quantity of '+title.textContent);
        plus.addEventListener('click', () => changeQty(index,1));
        controls.append(minus,number,plus);
        info.append(controls);
        const remove = document.createElement('button');
        remove.type = 'button'; remove.className = 'remove-btn';
        remove.textContent = 'Remove'; remove.addEventListener('click',()=>removeItem(index));
        row.append(info,remove);container.append(row);
      });
      summary.textContent = count + ' item' + (count === 1 ? '' : 's') +
        (checking ? ' · Verifying prices…'
          : unavailable ? ' · Total unavailable until all items are verified'
          : ' · Total: ' + currency.format(total));
      if (changed && !unavailable) {
        document.getElementById('cart-check-status').textContent =
          'Product prices have changed. The total above uses current prices.';
      }
    }
    function changeQty(index,delta) {
      const cart=readCart();
      if (!cart[index]) return;
      const next=itemQty(cart[index])+delta;
      if (next < 1) cart.splice(index,1);
      else cart[index].qty=Math.min(99,next);
      saveCart(cart);
    }
    function removeItem(index) {
      const cart=readCart();cart.splice(index,1);saveCart(cart);
    }
    window.addEventListener('pageshow', e => {if (e.persisted) refreshCart();});
    refreshCart();
  </script>
</body>
</html>
