<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Wildwood & Willow Botanicals</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; height: 100vh; }
    .shop-wrap { display: flex; flex-direction: column; height: 100vh; }
    .shop-header { padding: 8px 10px; background: #faf8f5; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
    .shop-header a { color: var(--olive); text-decoration: none; font-size: 0.75rem; }
    .shop-header h1 { font-size: 1rem; color: var(--olive); margin: 0; }
    .tabs { display: flex; gap: 4px; padding: 6px 8px; background: #faf8f5; overflow-x: auto; flex-shrink: 0; }
    .tabs button { border: 1px solid #e8e0d8; background: white; border-radius: 12px; padding: 4px 10px; font-size: 0.7rem; color: var(--olive); }
    .tabs button.active { background: var(--olive); color: white; }
    .shop-grid { flex: 1; display: grid; grid-template-columns: 1fr 1fr; gap: 6px; padding: 8px; align-content: start; overflow: hidden; }
    .shop-card { background: white; border: 1px solid #e8e0d8; border-radius: 8px; padding: 6px; text-align: center; }
    .shop-card img { width: 100%; height: 80px; object-fit: cover; border-radius: 6px; background: #f9f6f2; }
    .shop-card h3 { font-size: 0.75rem; margin: 4px 0 1px; }
    .shop-card p { font-size: 0.6rem; color: #555; }
    .pager { display: flex; justify-content: center; gap: 6px; padding: 6px; background: #faf8f5; flex-shrink: 0; }
    .pager button { border: 1px solid #e8e0d8; background: white; border-radius: 6px; padding: 4px 10px; font-size: 0.7rem; }
  </style>
</head>
<body>
  <div class="shop-wrap">
    <div class="shop-header">
      <a href="/">← Home</a>
      <h1>Shop</h1>
      <span></span>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="shop-grid" id="shop-grid"></div>
    <div class="pager" id="pager"></div>
  </div>

  <script>
    const allProducts = [];
    const categories = ['All', 'Capsules', 'Tinctures', 'Teas', 'Topicals', 'Home'];
    let currentCategory = 'All';
    let currentPage = 1;
    const perPage = 4;

    async function loadAll() {
      const slugs = ['arnica-aloe-cream', 'mental-reset', 'nerve-pain-relaxant', 'appetite-suppressant'];
      for (const slug of slugs) {
        try {
          const res = await fetch(`/content/products/${slug}.md`);
          if (!res.ok) continue;
          const text = await res.text();
          const match = text.match(/---\n([\s\S]*?)\n---/);
          if (!match) continue;
          const data = {};
          match[1].split('\n').forEach(line => {
            const [key, ...rest] = line.split(':');
            if (key && rest.length) data[key.trim()] = rest.join(':').trim();
          });
          allProducts.push(data);
        } catch (e) {}
      }
      renderTabs();
      render();
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = categories.map(cat => 
        `<button class="${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderTabs();
      render();
    }

    function render() {
      const filtered = currentCategory === 'All' 
        ? allProducts 
        : allProducts.filter(p => p.category === currentCategory);
      const totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
      const start = (currentPage - 1) * perPage;
      const pageItems = filtered.slice(start, start + perPage);

      const grid = document.getElementById('shop-grid');
      grid.innerHTML = pageItems.map(p => `
        <div class="shop-card">
          <img src="${p.image || ''}" alt="" onerror="this.style.background='#f9f6f2'">
          <h3>${p.title || ''}</h3>
          <p>${p.description || ''}</p>
        </div>
      `).join('') || '<p style="grid-column:1/-1;text-align:center;color:#888;font-size:0.8rem;">No products in this category yet.</p>';

      const pager = document.getElementById('pager');
      pager.innerHTML = totalPages > 1 ? `
        <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
        <span style="font-size:0.7rem;align-self:center;">${currentPage} / ${totalPages}</span>
        <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
      ` : '';
    }

    function changePage(delta) {
      currentPage += delta;
      render();
    }

    loadAll();
  </script>
</body>
</html>
