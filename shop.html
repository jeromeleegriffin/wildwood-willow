<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Wildwood & Willow Botanicals</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: auto; height: auto; }
    .shop-header { padding: 12px; text-align: center; background: #faf8f5; }
    .shop-header a { color: var(--olive); text-decoration: none; font-size: 0.8rem; }
    .shop-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; padding: 10px; }
    .shop-card { background: white; border: 1px solid #e8e0d8; border-radius: 8px; padding: 8px; text-align: center; }
    .shop-card img { width: 100%; height: 120px; object-fit: cover; border-radius: 6px; background: #f9f6f2; }
    .shop-card h3 { font-size: 0.85rem; margin: 6px 0 2px; }
    .shop-card p { font-size: 0.7rem; color: #555; }
  </style>
</head>
<body>
  <div class="shop-header">
    <a href="/">← Back to Home</a>
    <h1 style="font-size:1.2rem; color:var(--olive); margin-top:6px;">Shop All Products</h1>
  </div>
  <div class="shop-grid" id="shop-grid"></div>

  <script>
    async function loadAllProducts() {
      const slugs = ['arnica-aloe-cream', 'mental-reset', 'nerve-pain-relaxant', 'appetite-suppressant'];
      const products = [];
      for (const slug of slugs) {
        try {
          const res = await fetch(`/content/products/${slug}.md`);
          if (!res.ok) continue;
          const text = await res.text();
          const match = text.match(/---\n([\s\S]*?)\n---/);
          if (!match) continue;
          const data = {};
          match[1].split('\n').forEach(line => {
            const [key, ...rest] = line.split(':');
            if (key && rest.length) data[key.trim()] = rest.join(':').trim();
          });
          products.push(data);
        } catch (e) {}
      }
      const grid = document.getElementById('shop-grid');
      grid.innerHTML = products.map(p => `
        <div class="shop-card">
          <img src="${p.image || ''}" alt="" onerror="this.style.background='#f9f6f2'">
          <h3>${p.title || ''}</h3>
          <p>${p.description || ''}</p>
        </div>
      `).join('');
    }
    loadAllProducts();
  </script>
</body>
</html>
