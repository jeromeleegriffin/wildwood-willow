<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop | Wildwood & Willow Botanicals</title>
  <link rel="stylesheet" href="css/style.css">
  <style>
    body { overflow: hidden; height: 100vh; }
    .shop-wrap { display: flex; flex-direction: column; height: 100vh; }
    .shop-header { padding: 6px 10px; background: #faf8f5; flex-shrink: 0; display: flex; justify-content: space-between; align-items: center; }
    .shop-header a { color: var(--olive); text-decoration: none; font-size: 0.7rem; }
    .shop-header h1 { font-size: 0.95rem; color: var(--olive); margin: 0; }
    .mode-switch { display: flex; gap: 4px; padding: 4px 8px; background: #faf8f5; flex-shrink: 0; }
    .mode-switch button { flex: 1; border: 1px solid #e8e0d8; background: white; border-radius: 8px; padding: 4px; font-size: 0.7rem; color: var(--olive); }
    .mode-switch button.active { background: var(--olive); color: white; }
    .tabs { display: flex; gap: 3px; padding: 4px 6px; background: #faf8f5; overflow-x: auto; flex-shrink: 0; }
    .tabs button { border: 1px solid #e8e0d8; background: white; border-radius: 10px; padding: 3px 8px; font-size: 0.65rem; color: var(--olive); white-space: nowrap; }
    .tabs button.active { background: var(--terracotta); color: white; }
    .shop-grid { flex: 1; min-height: 0; display: grid; grid-template-columns: 1fr 1fr 1fr 1fr; grid-auto-rows: max-content; gap: 4px; padding: 6px; align-content: start; overflow-y: auto; }
    .shop-card { display:block; min-width:0; background: white; border: 1px solid #e8e0d8; border-radius: 6px; padding: 4px; text-align: center; text-decoration:none; color:inherit; cursor:pointer; }
    .shop-card img { width: 100%; height: 48px; object-fit: cover; border-radius: 4px; background: #f9f6f2; }
    .shop-card h3 { font-size: 0.6rem; margin: 2px 0 1px; line-height: 1.1; overflow-wrap:anywhere; }
    .shop-card p { font-size: 0.5rem; color: #555; line-height: 1.1; }
    .pager { display: flex; justify-content: center; gap: 6px; padding: 4px; background: #faf8f5; flex-shrink: 0; }
    .pager button { border: 1px solid #e8e0d8; background: white; border-radius: 6px; padding: 3px 8px; font-size: 0.65rem; }
  </style>
  <script src="/js/store-status.js?v=7" defer></script>
  <script src="/js/catalog.js?v=1"></script>
</head>
<body>
  <div class="shop-wrap">
    <div class="shop-header">
      <a href="/">← Home</a>
      <h1>Shop</h1>
      <span></span>
    </div>
    <div class="mode-switch">
      <button id="btn-products" class="active" onclick="setMode('products')">Products</button>
      <button id="btn-services" onclick="setMode('services')">Services</button>
    </div>
    <div class="tabs" id="tabs"></div>
    <div class="shop-grid" id="shop-grid"></div>
    <div class="pager" id="pager"></div>
  </div>

  <script>
    const data = { products: [], services: [] };
    const productCats = ['All', 'Capsules', 'Tinctures', 'Teas', 'Topicals', 'Home'];
    let mode = 'products';
    let currentCategory = 'All';
    let currentPage = 1;
    const perPage = 8;

    async function init() {
      [data.products, data.services] = await Promise.all([
        window.WWCatalog.list('products'),
        window.WWCatalog.list('services')
      ]);
      renderTabs();
      render();
    }

    function setMode(m) {
      mode = m;
      currentCategory = 'All';
      currentPage = 1;
      document.getElementById('btn-products').classList.toggle('active', m === 'products');
      document.getElementById('btn-services').classList.toggle('active', m === 'services');
      renderTabs();
      render();
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      if (mode === 'services') {
        tabs.innerHTML = '';
        return;
      }
      tabs.innerHTML = productCats.map(cat => 
        `<button class="${cat === currentCategory ? 'active' : ''}" onclick="setCategory('${cat}')">${cat}</button>`
      ).join('');
    }

    function setCategory(cat) {
      currentCategory = cat;
      currentPage = 1;
      renderTabs();
      render();
    }

    function render() {
      let items = mode === 'products' ? data.products : data.services;
      if (mode === 'products' && currentCategory !== 'All') {
        items = items.filter(p => p.category === currentCategory);
      }
      const totalPages = Math.max(1, Math.ceil(items.length / perPage));
      const start = (currentPage - 1) * perPage;
      const pageItems = items.slice(start, start + perPage);

      const grid = document.getElementById('shop-grid');
      grid.replaceChildren();
      if (!pageItems.length) {
        const empty = document.createElement('p');
        empty.style.cssText = 'grid-column:1/-1;text-align:center;color:#777;font-size:.78rem;padding:20px 4px;';
        empty.textContent = 'No items in this category yet.';
        grid.append(empty);
      }
      pageItems.forEach(item => {
        const link = document.createElement('a');
        link.className = 'shop-card';
        link.href = mode === 'products'
          ? 'product.html?p=' + encodeURIComponent(item.slug) + '&type=products'
          : 'category.html?category=Services';
        link.setAttribute('aria-label', mode === 'products'
          ? 'View product: ' + (item.title || 'Product')
          : 'Learn about services: ' + (item.title || 'Service'));
        if (item.image) {
          const img = document.createElement('img');
          img.src = window.WWCatalog.image(item.image);
          img.alt = '';
          img.onerror = () => { img.remove(); };
          link.append(img);
        }
        const title = document.createElement('h3');
        title.textContent = item.title || 'Item';
        const description = document.createElement('p');
        description.textContent = item.description || '';
        link.append(title, description);
        grid.append(link);
      });

      const pager = document.getElementById('pager');
      pager.innerHTML = totalPages > 1 ? `
        <button onclick="changePage(-1)" ${currentPage === 1 ? 'disabled' : ''}>Prev</button>
        <span style="font-size:0.65rem;align-self:center;">${currentPage}/${totalPages}</span>
        <button onclick="changePage(1)" ${currentPage === totalPages ? 'disabled' : ''}>Next</button>
      ` : '';
    }

    function changePage(delta) {
      currentPage += delta;
      render();
    }

    init();
  </script>
</body>
</html>
